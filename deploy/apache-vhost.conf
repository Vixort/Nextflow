# ============================================================
# Nextflow on Apache (reverse proxy in front of the Node.js app)
# ------------------------------------------------------------
# This app is a Next.js dynamic app — it needs the Node runtime for the
# API routes (/api/*), custom JWT auth, MariaDB access and the Next 16
# network boundary (proxy.ts: rate limiting + payload limits). Apache
# cannot run it directly, but it CAN be the front door: Apache listens on
# 80/443 (SSL, gzip, logs) and proxies every request to the Node server.
#
# Steps:
#   1. Build + start the app on the server:  npm run build && npm run start  (port 3000)
#   2. Enable Apache modules:  sudo a2enmod proxy proxy_http headers rewrite
#   3. Drop this file at /etc/apache2/sites-available/nextflow.conf
#   4. Enable + reload:  sudo a2ensite nextflow && sudo systemctl reload apache2
#
# The MariaDB database and the local storage folder (storage/) must live on
# the same machine as the Node process. The Node process can be supervised
# with systemd or PM2.
# ============================================================

<VirtualHost *:80>
  ServerName your-domain.com
  # Optional: redirect to HTTPS (enable after SSL is configured)
  # RewriteEngine On
  # RewriteCond %{HTTPS} off
  # RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

  # --- Forward EVERYTHING to the Node.js app ---
  # The app (proxy.ts) does its own payload limits, rate limiting and auth,
  # so pass the real client info through so IP detection still works.
  ProxyPreserveHost On
  ProxyRequests Off

  ProxyPass / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/

  # Forward the real client IP + protocol (the app reads X-Forwarded-*).
  RequestHeader set X-Forwarded-Proto "http"
  # mod_proxy already sets X-Forwarded-For; keep it.
  # If you sit behind a CDN/load balancer, set X-Real-IP from the CDN header:
  # RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

  # Large uploads (template zip import is exempt from the 1MB body limit in
  # proxy.ts, but still make sure Apache doesn't cut the body first).
  LimitRequestBody 0

  # Useful headers
  Header set X-Frame-Options "SAMEORIGIN"
  Header set X-Content-Type-Options "nosniff"

  # Logging
  ErrorLog  ${APACHE_LOG_DIR}/nextflow-error.log
  CustomLog ${APACHE_LOG_DIR}/nextflow-access.log combined
</VirtualHost>

# HTTPS version (use certbot / Let's Encrypt for the certificate).
# <VirtualHost *:443>
#   ServerName your-domain.com
#   SSLEngine On
#   SSLCertificateFile      /etc/letsencrypt/live/your-domain.com/fullchain.pem
#   SSLCertificateKeyFile   /etc/letsencrypt/live/your-domain.com/privkey.pem
#   ProxyPreserveHost On
#   ProxyPass / http://127.0.0.1:3000/
#   ProxyPassReverse / http://127.0.0.1:3000/
#   RequestHeader set X-Forwarded-Proto "https"
# </VirtualHost>